name: Deploy Receipt

on:
  push:
    branches: [main]

env:
  APP_URL: https://ai-market-frontend-production.up.railway.app
  EVENTS_URL: https://ai-market-backend-production.up.railway.app/api/v1/allai/events/
  SERVICE_KEY: svc:ai-market-frontend

jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Observe health and build revision; report receipt status
        env:
          RECEIPT_KEY: ${{ secrets.DEPLOY_RECEIPT_KEY }}
        run: |
          node --input-type=module <<'JS'
          import { runFromEnvironment } from './scripts/deploy-receipt.mjs';
          await runFromEnvironment();
          JS
